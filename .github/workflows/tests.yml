name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Build isolated MemoryKeys bridge (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export TMPDIR="$RUNNER_TEMP/bridge"
          mkdir -p "$TMPDIR"
          bash scripts/ci-build-harness.sh "$TMPDIR/libSnapshotBridgeHarness.dylib"
          echo "SNAPSHOT_TEST_HARNESS=$TMPDIR/libSnapshotBridgeHarness.dylib" >> "$GITHUB_ENV"
      - name: Go tests
        shell: bash
        run: |
          set -o pipefail
          go test -tags headless -count=1 -json ./... | tee "$RUNNER_TEMP/go-tests.jsonl"
      - name: Enforce test-only fixture imports
        run: bash scripts/ci-check-fixtures.sh
      - name: Vet
        run: go vet -tags headless ./...
      - name: Go race (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          go test -race -tags headless -count=1 -json ./... | tee "$RUNNER_TEMP/go-race.jsonl"
      - name: Keep test and skip evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: go-results-${{ matrix.os }}
          path: ${{ runner.temp }}/go-*.jsonl
          if-no-files-found: warn
  swift:
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [macos, macos/Authentication]
    steps:
      - uses: actions/checkout@v6
      - run: swift test --package-path "${{ matrix.package }}"
